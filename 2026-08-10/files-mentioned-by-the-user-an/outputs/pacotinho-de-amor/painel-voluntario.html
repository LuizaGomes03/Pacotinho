function salvarDisponibilidade() {
  const feedback = document.getElementById("feedbackDisponibilidade");
  if (!feedback) return;
  feedback.classList.remove("hidden");
  setTimeout(() => feedback.classList.add("hidden"), 3000);
}

function configurarEventosDisponibilidade() {
  document.querySelectorAll(".day-toggle").forEach(toggle => {
    toggle.addEventListener("change", function () {
      const row = this.closest(".availability-row");
      if (!row) return;

      row.querySelectorAll(".time-input").forEach(input => {
        input.disabled = !this.checked;
        input.classList.toggle("opacity-50", !this.checked);
      });
    });
  });
}

function mostrarPagina(pagina) {
  const conteudo = document.getElementById("conteudo-painel");
  if (!conteudo) return;

  const paginaValida = Object.prototype.hasOwnProperty.call(paginas, pagina)
    ? pagina
    : "inicio";

  conteudo.innerHTML = paginas[paginaValida];

  if (paginaValida === "eventos") {
    carregarEventosVoluntario();
  }

  document.querySelectorAll("[data-menu]").forEach(item => {
    item.classList.remove("bg-white/20", "text-white", "font-bold");
    item.classList.add("text-white/70");
    if (item.dataset.menu === pagina) {
      item.classList.remove("text-white/70");
      item.classList.add("bg-white/20", "text-white", "font-bold");
    }
  });
}

document.addEventListener("DOMContentLoaded", () => {
  mostrarPagina("inicio");
  configurarEventosDisponibilidade();
});

<script>
/*
 * EVENTOS - PAINEL DO VOLUNTÁRIO
 *
 * Eventos são criados somente pela conta Master/Bárbara.
 * O voluntário apenas:
 * 1. visualiza os eventos publicados;
 * 2. escolhe um animal atribuído a ele;
 * 3. envia uma solicitação;
 * 4. aguarda a aprovação da Bárbara.
 *
 * API esperada:
 * GET  /api/events
 * GET  /api/event-requests?volunteerId=...
 * POST /api/event-requests
 */

const API_URL = "/api";

/*
 * ID do voluntário atualmente conectado.
 *
 * Este é o ID que você mostrou para "Equipe Pacotinho":
 * 6a7a808c4fce3aac7eb3a1fa
 *
 * Quando o login estiver ligado à sessão, substitua esta constante
 * pela informação da sessão/token.
 */
const VOLUNTARIO_ID = "6a7a808c4fce3aac7eb3a1fa";

let eventoSelecionadoParaSolicitacao = null;
let eventosCarregados = [];
let solicitacoesDoVoluntario = [];
let animaisDoVoluntario = [
  {
    id: "luna-demo",
    name: "Luna"
  },
  {
    id: "thor-demo",
    name: "Thor"
  }
];


function escaparHTML(valor) {
  if (valor === null || valor === undefined) return "";

  return String(valor)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function obterId(item) {
  if (!item) return "";

  return (
    item._id?.$oid ||
    item._id ||
    item.id ||
    ""
  );
}


function formatarDataEvento(data) {
  if (!data) return "Data não informada";

  const partes = String(data).split("-");

  if (partes.length !== 3) {
    return data;
  }

  return `${partes[2]}/${partes[1]}/${partes[0]}`;
}


function formatarHorarioEvento(evento) {
  if (evento.startTime && evento.endTime) {
    return `${evento.startTime} às ${evento.endTime}`;
  }

  return evento.horario || "Horário não informado";
}


function statusSolicitacao(status) {
  const mapa = {
    pending: {
      texto: "Aguardando aprovação",
      classe: "bg-yellow-100 text-yellow-800"
    },
    approved: {
      texto: "Aprovada",
      classe: "bg-green-100 text-green-800"
    },
    rejected: {
      texto: "Recusada",
      classe: "bg-red-100 text-red-800"
    }
  };

  return mapa[status] || mapa.pending;
}


async function obterEventos() {
  const resposta = await fetch(`${API_URL}/events`, {
    method: "GET",
    headers: {
      "Content-Type": "application/json"
    }
  });

  if (!resposta.ok) {
    throw new Error("Não foi possível carregar os eventos.");
  }

  const dados = await resposta.json();

  if (Array.isArray(dados)) return dados;

  if (Array.isArray(dados.events)) {
    return dados.events;
  }

  return [];
}


async function obterSolicitacoes() {
  const resposta = await fetch(
    `${API_URL}/event-requests?volunteerId=${encodeURIComponent(VOLUNTARIO_ID)}`,
    {
      method: "GET",
      headers: {
        "Content-Type": "application/json"
      }
    }
  );

  /*
   * Se a rota ainda não existir, não impedimos a visualização
   * dos eventos. O restante do sistema pode ser conectado depois.
   */
  if (!resposta.ok) {
    return [];
  }

  const dados = await resposta.json();

  if (Array.isArray(dados)) return dados;

  if (Array.isArray(dados.requests)) {
    return dados.requests;
  }

  return [];
}


function obterSolicitacaoDoEvento(eventoId) {
  return solicitacoesDoVoluntario.find(
    item => String(obterId(item.eventId || item.event)) === String(eventoId)
  );
}


function renderizarEventosVoluntario() {
  const container = document.getElementById("listaEventosVoluntario");

  if (!container) return;

  if (!eventosCarregados.length) {
    container.innerHTML = `
      <div class="md:col-span-2 p-lg rounded-xl bg-surface-container-low text-center">
        <span class="material-symbols-outlined text-4xl text-primary">event</span>

        <p class="font-bold mt-2">
          Nenhum evento disponível
        </p>

        <p class="text-sm text-on-surface-variant mt-1">
          Quando Bárbara publicar um evento, ele aparecerá aqui.
        </p>
      </div>
    `;

    return;
  }


  container.innerHTML = eventosCarregados.map(evento => {

    const id = obterId(evento);

    const titulo =
      evento.title ||
      evento.nome ||
      "Evento do projeto";

    const descricao =
      evento.description ||
      evento.obs ||
      "";

    const data =
      evento.date ||
      evento.data ||
      "";

    const horario =
      formatarHorarioEvento(evento);

    const local =
      evento.location ||
      evento.local ||
      "Local não informado";

    const limiteAnimais =
      evento.animalLimit ??
      "-";

    const limiteVoluntarios =
      evento.volunteerLimit ??
      "-";

    const limiteEspaco =
      evento.spaceLimit ??
      "-";

    const solicitacao =
      obterSolicitacaoDoEvento(id);

    let acao = "";

    if (solicitacao) {

      const status = statusSolicitacao(
        solicitacao.status
      );

      acao = `
        <div class="mt-md rounded-xl ${status.classe} px-4 py-3">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-base">
              ${solicitacao.status === "approved"
                ? "check_circle"
                : solicitacao.status === "rejected"
                  ? "cancel"
                  : "schedule"}
            </span>

            <p class="font-semibold text-sm">
              ${status.texto}
            </p>
          </div>
        </div>
      `;

    } else {

      acao = `
        <button
          type="button"
          onclick="abrirSolicitacaoEvento('${escaparHTML(id)}')"
          class="mt-md w-full bg-[#5F376E] text-white px-5 py-3 rounded-full font-semibold hover:bg-[#472056] transition-colors flex items-center justify-center gap-2"
        >
          <span class="material-symbols-outlined">
            pets
          </span>

          Solicitar vaga para meu animal
        </button>
      `;
    }


    return `
      <article class="bg-surface-container-low rounded-xl shadow-md border border-surface-variant/50 p-md">

        <div class="flex items-start justify-between gap-sm">

          <div>

            <span class="inline-flex px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container text-xs font-semibold mb-2">
              Evento publicado
            </span>

            <h3 class="font-headline-md text-headline-md text-primary">
              ${escaparHTML(titulo)}
            </h3>

            <p class="text-sm text-on-surface-variant mt-1">
              ${escaparHTML(formatarDataEvento(data))}
              •
              ${escaparHTML(horario)}
            </p>

          </div>

          <span class="material-symbols-outlined text-primary">
            event
          </span>

        </div>


        <div class="mt-md p-md rounded-xl bg-surface-container-lowest">

          <div class="flex items-start gap-2">

            <span class="material-symbols-outlined text-primary">
              location_on
            </span>

            <div>

              <p class="font-semibold">
                ${escaparHTML(local)}
              </p>

              ${
                evento.spaceDescription
                  ? `
                    <p class="text-sm text-on-surface-variant mt-1">
                      ${escaparHTML(evento.spaceDescription)}
                    </p>
                  `
                  : ""
              }

            </div>

          </div>

        </div>


        ${
          descricao
            ? `
              <p class="mt-md text-sm text-on-surface-variant leading-6">
                ${escaparHTML(descricao)}
              </p>
            `
            : ""
        }


        <div class="grid grid-cols-3 gap-2 mt-md">

          <div class="rounded-lg bg-white p-3 text-center">

            <span class="material-symbols-outlined text-primary">
              pets
            </span>

            <p class="text-xs text-on-surface-variant mt-1">
              Animais
            </p>

            <p class="font-bold">
              ${escaparHTML(limiteAnimais)}
            </p>

          </div>


          <div class="rounded-lg bg-white p-3 text-center">

            <span class="material-symbols-outlined text-primary">
              groups
            </span>

            <p class="text-xs text-on-surface-variant mt-1">
              Voluntários
            </p>

            <p class="font-bold">
              ${escaparHTML(limiteVoluntarios)}
            </p>

          </div>


          <div class="rounded-lg bg-white p-3 text-center">

            <span class="material-symbols-outlined text-primary">
              meeting_room
            </span>

            <p class="text-xs text-on-surface-variant mt-1">
              Capacidade
            </p>

            <p class="font-bold">
              ${escaparHTML(limiteEspaco)}
            </p>

          </div>

        </div>


        ${acao}

      </article>
    `;

  }).join("");
}


async function carregarEventosVoluntario() {

  const container =
    document.getElementById("listaEventosVoluntario");

  if (!container) return;

  container.innerHTML = `
    <div class="md:col-span-2 p-lg rounded-xl bg-surface-container-low text-center">

      <span class="material-symbols-outlined text-4xl text-primary animate-pulse">
        sync
      </span>

      <p class="font-bold mt-2">
        Carregando eventos...
      </p>

    </div>
  `;


  try {

    eventosCarregados =
      await obterEventos();


    solicitacoesDoVoluntario =
      await obterSolicitacoes();


    /*
     * Mostramos apenas eventos publicados.
     */
    eventosCarregados =
      eventosCarregados.filter(
        evento =>
          !evento.status ||
          evento.status === "published"
      );


    renderizarEventosVoluntario();


  } catch (erro) {

    console.error(
      "Erro ao carregar eventos:",
      erro
    );


    container.innerHTML = `
      <div class="md:col-span-2 p-lg rounded-xl bg-red-50 border border-red-200">

        <div class="flex items-start gap-3">

          <span class="material-symbols-outlined text-red-600">
            error
          </span>

          <div>

            <p class="font-bold text-red-800">
              Não foi possível carregar os eventos.
            </p>

            <p class="text-sm text-red-700 mt-1">
              Verifique se o servidor está funcionando.
            </p>

          </div>

        </div>

      </div>
    `;
  }
}


function abrirSolicitacaoEvento(eventoId) {

  eventoSelecionadoParaSolicitacao =
    eventosCarregados.find(
      evento =>
        String(obterId(evento)) === String(eventoId)
    );


  if (!eventoSelecionadoParaSolicitacao) {
    alert("Evento não encontrado.");
    return;
  }


  const modal =
    document.getElementById(
      "modalSolicitacaoEvento"
    );

  const resumo =
    document.getElementById(
      "eventoSolicitacaoResumo"
    );


  const select =
    document.getElementById(
      "animalEventoSelect"
    );


  if (!modal || !resumo || !select) {
    return;
  }


  const evento =
    eventoSelecionadoParaSolicitacao;


  resumo.innerHTML = `
    <strong>
      ${escaparHTML(
        evento.title ||
        evento.nome ||
        "Evento"
      )}
    </strong>

    <br>

    ${escaparHTML(
      formatarDataEvento(
        evento.date ||
        evento.data
      )
    )}

    •

    ${escaparHTML(
      formatarHorarioEvento(evento)
    )}

    <br>

    ${escaparHTML(
      evento.location ||
      evento.local ||
      "Local não informado"
    )}
  `;


  select.innerHTML = animaisDoVoluntario.map(
    animal => `
      <option value="${escaparHTML(
        obterId(animal)
      )}">
        ${escaparHTML(
          animal.name ||
          animal.nome ||
          "Animal"
        )}
      </option>
    `
  ).join("");


  if (!animaisDoVoluntario.length) {

    select.innerHTML = `
      <option value="">
        Nenhum animal atribuído
      </option>
    `;

  }


  document.getElementById(
    "observacaoEvento"
  ).value = "";


  document.getElementById(
    "erroSolicitacaoEvento"
  ).classList.add("hidden");


  modal.classList.remove("hidden");
  modal.classList.add("flex");
}


function fecharModalSolicitacao() {

  const modal =
    document.getElementById(
      "modalSolicitacaoEvento"
    );

  if (!modal) return;

  modal.classList.add("hidden");
  modal.classList.remove("flex");

  eventoSelecionadoParaSolicitacao = null;
}


function mostrarErroSolicitacao(mensagem) {

  const erro =
    document.getElementById(
      "erroSolicitacaoEvento"
    );

  if (!erro) return;

  erro.textContent = mensagem;
  erro.classList.remove("hidden");
}


async function enviarSolicitacaoEvento() {

  if (!eventoSelecionadoParaSolicitacao) {
    return;
  }


  const animalId =
    document.getElementById(
      "animalEventoSelect"
    ).value;


  const observacao =
    document.getElementById(
      "observacaoEvento"
    ).value.trim();


  if (!animalId) {

    mostrarErroSolicitacao(
      "Selecione um animal antes de enviar a solicitação."
    );

    return;
  }


  const btn =
    document.getElementById(
      "btnEnviarSolicitacaoEvento"
    );


  btn.disabled = true;

  btn.innerHTML = `
    <span class="material-symbols-outlined animate-spin">
      progress_activity
    </span>
    Enviando...
  `;


  const eventoId =
    obterId(
      eventoSelecionadoParaSolicitacao
    );


  const solicitacao = {

    eventId: eventoId,

    volunteerId: VOLUNTARIO_ID,

    animalId: animalId,

    status: "pending",

    observation: observacao,

    createdAt:
      new Date().toISOString()

  };


  try {

    const resposta =
      await fetch(
        `${API_URL}/event-requests`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body:
            JSON.stringify(
              solicitacao
            )
        }
      );


    const resultado =
      await resposta
        .json()
        .catch(
          () => ({})
        );


    if (!resposta.ok) {

      throw new Error(
        resultado.message ||
        resultado.error ||
        "Não foi possível enviar a solicitação."
      );

    }


    fecharModalSolicitacao();


    alert(
      "Solicitação enviada! Agora aguarde a aprovação da Bárbara."
    );


    /*
     * Atualiza as solicitações para que o botão
     * passe a mostrar "Aguardando aprovação".
     */
    solicitacoesDoVoluntario =
      await obterSolicitacoes();


    renderizarEventosVoluntario();


  } catch (erro) {

    console.error(
      "Erro ao solicitar participação:",
      erro
    );


    mostrarErroSolicitacao(
      erro.message ||
      "Não foi possível enviar a solicitação."
    );


  } finally {

    btn.disabled = false;

    btn.innerHTML = `
      <span class="material-symbols-outlined">
        send
      </span>
      Solicitar vaga
    `;
  }
}


/*
 * Quando o voluntário abre a página de eventos,
 * buscamos os eventos publicados no banco.
 */
document.addEventListener(
  "DOMContentLoaded",
  () => {

    carregarEventosVoluntario();

  }
);
</script>
