<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do voluntário — Pacotinho de Amor</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#472056",
            "primary-container": "#5f376e",
            "primary-fixed": "#f9d8ff",
            secondary: "#78517a",
            "secondary-container": "#ffcdfe",
            background: "#f7f1f8",
            "on-surface": "#1d1a20",
            "on-surface-variant": "#4c444d",
            "outline-variant": "#cfc3ce",
            "surface-variant": "#e7e0e8",
            "surface-low": "#f8f1f9"
          },
          fontFamily: { sans: ["Montserrat", "sans-serif"] }
        }
      }
    }
  </script>

  <style>
    body { font-family: Montserrat, sans-serif; }
    a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #e7b5f6; outline-offset: 2px; }
    .campo { width: 100%; border: 1px solid #cfc3ce; border-radius: .6rem; padding: .7rem .9rem; font-size: 15px; background: #fff; }
    .campo:focus { border-color: #5f376e; box-shadow: 0 0 0 2px rgba(95,55,110,.15); outline: none; }
    .rotulo { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; color: #1d1a20; }
    #toast { transition: opacity .2s, transform .2s; }
    #toast.oculto { opacity: 0; transform: translateY(10px); pointer-events: none; }

    /* Campos de número sem as setinhas do navegador (usamos botões − e +) */
    .sem-setas::-webkit-inner-spin-button,
    .sem-setas::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .sem-setas { -moz-appearance: textfield; }

    /* Seta dos blocos que abrem e fecham */
    details > summary::-webkit-details-marker { display: none; }
    details[open] .gira { transform: rotate(180deg); }
  </style>
</head>

<body class="bg-background text-on-surface">

<!-- Tela de carregamento enquanto confere o login -->
<div id="verificando" class="fixed inset-0 z-[300] flex items-center justify-center bg-background">
  <p class="font-semibold text-primary">Verificando acesso...</p>
</div>

<!-- ==================== MENU LATERAL (COMPUTADOR) ==================== -->
<aside class="fixed inset-y-0 left-0 z-40 hidden w-64 flex-col bg-primary-container py-6 text-white md:flex">
  <div class="flex items-center gap-3 px-6">
    <img src="assets/logo-footer.png" alt="" class="h-10 w-10 rounded-full object-cover">
    <span class="text-lg font-bold leading-tight">Pacotinho<br>de amor</span>
  </div>

  <!-- Linha que separa a marca do perfil -->
  <hr class="mx-6 my-5 border-0 border-t border-white/20">

  <div class="mb-6 flex items-center gap-3 px-6">
    <!-- Foto de perfil, ou as iniciais quando a pessoa não tem foto -->
    <span data-avatar class="grid h-11 w-11 shrink-0 place-items-center overflow-hidden rounded-full bg-[#f6cfdf] text-base font-bold text-primary ring-2 ring-white/30"></span>
    <div class="min-w-0">
      <p class="text-sm text-white/70">Olá,</p>
      <p class="font-bold leading-tight [overflow-wrap:anywhere]" data-nome>…</p>
      <p class="mt-0.5 text-xs text-white/60">Voluntário(a)</p>
    </div>
  </div>

  <nav id="menuLateral" class="flex flex-1 flex-col gap-1 pr-3"></nav>

  <div class="border-t border-white/20 pr-3 pt-3">
    <button type="button" data-ir="config" class="item-menu flex w-full items-center gap-3 rounded-r-full px-6 py-3 text-left text-white/75 hover:bg-white/10">
      <span class="material-symbols-outlined">settings</span> Configurações
    </button>
    <button type="button" onclick="sair()" class="flex w-full items-center gap-3 rounded-r-full px-6 py-3 text-left text-[#ffdad6] hover:bg-white/10">
      <span class="material-symbols-outlined">logout</span> Sair
    </button>
  </div>
</aside>

<!-- ==================== TOPO (CELULAR) ==================== -->
<header class="sticky top-0 z-30 flex items-center justify-between border-b border-surface-variant bg-white px-4 py-3 md:hidden">
  <div class="flex items-center gap-2">
    <img src="assets/logo-footer.png" alt="" class="h-8 w-8 rounded-full">
    <span class="font-bold text-primary">Painel do voluntário</span>
  </div>
  <div class="flex items-center gap-1">
    <button type="button" data-ir="config" aria-label="Configurações" class="rounded-full p-2 text-primary hover:bg-surface-low">
      <span class="material-symbols-outlined">settings</span>
    </button>
    <button type="button" onclick="sair()" aria-label="Sair" class="rounded-full p-2 text-primary hover:bg-surface-low">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</header>

<!-- ==================== CONTEÚDO ==================== -->
<main class="min-h-screen pb-24 md:ml-64 md:pb-8">
  <div id="conteudo" class="mx-auto w-full max-w-6xl p-4 md:p-8"></div>
</main>

<!-- ==================== MENU INFERIOR (CELULAR) ==================== -->
<nav id="menuInferior" class="fixed inset-x-0 bottom-0 z-40 grid grid-cols-4 border-t border-surface-variant bg-white px-1 pb-[calc(6px+env(safe-area-inset-bottom))] pt-1.5 md:hidden"></nav>

<!-- ==================== MODAL EDITAR ANIMAL ==================== -->
<div id="modalAnimal" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/50 p-4">
  <div class="max-h-[calc(100dvh-2rem)] w-full max-w-md overflow-y-auto rounded-2xl bg-white p-6 shadow-2xl">
    <div class="mb-4 flex items-start justify-between gap-3">
      <div>
        <p class="text-sm font-semibold text-secondary">Editar animal</p>
        <h2 id="animalTitulo" class="text-xl font-bold text-primary"></h2>
      </div>
      <button type="button" onclick="fecharModal('modalAnimal')" aria-label="Fechar" class="rounded-full p-2 hover:bg-surface-low">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <input id="animalId" type="hidden">

    <label for="animalStatus" class="text-base font-semibold text-primary">Situação</label>
    <select id="animalStatus" class="campo mb-1 text-base">
      <option value="disponível">Disponível para adoção</option>
      <option value="em adoção">Em processo de adoção</option>
    </select>
    <p class="mb-4 text-xs text-on-surface-variant">Só animais "disponíveis" aparecem no site.</p>

    <label for="animalResponsavel" class="text-base font-semibold text-primary">Responsável</label>
    <input id="animalResponsavel" class="campo mb-4 text-base" maxlength="120" placeholder="Ex.: Bárbara">

    <label for="animalDescricao" class="text-base font-semibold text-primary">Descrição</label>
    <textarea id="animalDescricao" class="campo mb-4 text-base" rows="5" maxlength="1000"></textarea>

    <label class="mb-5 flex items-center gap-3 rounded-xl border border-surface-variant p-3">
      <input id="animalPcd" type="checkbox" class="h-5 w-5 rounded text-primary-container focus:ring-primary-container">
      <span class="text-sm"><strong>Animal PCD</strong> (com alguma deficiência)</span>
    </label>

    <div class="grid gap-3 sm:grid-cols-2">
      <button type="button" id="btnSalvarAnimal" onclick="salvarAnimal()" class="w-full rounded-full bg-primary-container py-3.5 text-base font-semibold text-white hover:bg-primary disabled:opacity-60">Salvar alterações</button>
      <button type="button" onclick="removerAnimal(document.getElementById('animalId').value)" class="w-full rounded-full border border-red-200 py-3.5 text-base font-semibold text-red-700 hover:bg-red-50">Deletar perfil</button>
    </div>
  </div>
</div>

<!-- ==================== MODAL CRIAR EVENTO ==================== -->
<div id="modalEvento" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/50 p-4">
  <div class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-6 shadow-2xl">
    <div class="mb-4 flex items-start justify-between gap-3">
      <h2 class="text-xl font-bold text-primary">Criar evento</h2>
      <button type="button" onclick="fecharModal('modalEvento')" aria-label="Fechar" class="rounded-full p-2 hover:bg-surface-low">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <p class="mb-4 text-sm text-on-surface-variant">Todos os campos são obrigatórios.</p>

    <label for="evTitulo" class="rotulo">Nome do evento</label>
    <input id="evTitulo" class="campo mb-3" maxlength="120" placeholder="Ex.: Feirinha de adoção no parque">

    <label for="evDescricao" class="rotulo">Descrição</label>
    <textarea id="evDescricao" class="campo mb-3" rows="3" maxlength="1000"></textarea>

    <div class="mb-3 grid grid-cols-1 gap-3 sm:grid-cols-3">
      <div><label for="evData" class="rotulo">Data</label><input id="evData" type="date" class="campo"></div>
      <div><label for="evInicio" class="rotulo">Início</label><input id="evInicio" type="time" class="campo"></div>
      <div><label for="evFim" class="rotulo">Fim</label><input id="evFim" type="time" class="campo"></div>
    </div>

    <label for="evLocal" class="rotulo">Local</label>
    <input id="evLocal" class="campo mb-3" maxlength="200" placeholder="Endereço ou nome do lugar">

    <label for="evEspaco" class="rotulo">Sobre o espaço</label>
    <textarea id="evEspaco" class="campo mb-3" rows="2" maxlength="600" placeholder="Estrutura, regras, área coberta..."></textarea>

    <div class="mb-5 grid grid-cols-1 gap-3 sm:grid-cols-3">
      <div><label for="evAnimais" class="rotulo">Máx. animais</label><input id="evAnimais" type="number" min="1" value="10" class="campo"></div>
      <div><label for="evVoluntarios" class="rotulo">Máx. voluntários</label><input id="evVoluntarios" type="number" min="1" value="6" class="campo"></div>
      <div><label for="evCapacidade" class="rotulo">Capacidade</label><input id="evCapacidade" type="number" min="1" value="16" class="campo"></div>
    </div>

    <button type="button" id="btnSalvarEvento" onclick="salvarEvento()" class="w-full rounded-full bg-primary-container py-3 font-semibold text-white hover:bg-primary disabled:opacity-60">
      Publicar evento
    </button>
  </div>
</div>

<!-- ==================== CONFIRMAÇÃO ==================== -->
<div id="modalConfirmar" class="fixed inset-0 z-[250] hidden items-center justify-center bg-black/50 p-4">
  <div class="max-h-[calc(100dvh-2rem)] w-full max-w-sm overflow-y-auto rounded-2xl bg-white p-6 text-center shadow-2xl">
    <p id="confirmarTexto" class="mb-5 text-on-surface"></p>
    <div class="flex gap-2">
      <button type="button" id="confirmarNao" class="flex-1 rounded-full border border-outline-variant py-2.5 font-semibold text-primary">Cancelar</button>
      <button type="button" id="confirmarSim" class="flex-1 rounded-full bg-primary-container py-2.5 font-semibold text-white">Confirmar</button>
    </div>
  </div>
</div>

<!-- ==================== AVISO ==================== -->
<div id="toast" role="status" aria-live="polite" class="oculto fixed bottom-24 left-1/2 z-[300] max-w-[90vw] -translate-x-1/2 rounded-full bg-primary px-5 py-3 text-sm font-semibold text-white shadow-lg md:bottom-6"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */
const API = "/api";

const PAGINAS = [
  { id: "animais",    nome: "Animais",      curto: "Animais",    icone: "pets" },
  { id: "adocoes",    nome: "Solicitações", curto: "Pedidos",    icone: "family_restroom" },
  { id: "eventos",    nome: "Eventos",      curto: "Eventos",    icone: "event" },
  { id: "relatorios", nome: "Relatórios",   curto: "Relatórios", icone: "analytics" }
];

// "voluntarios" fica vazio: a conta de apoio não acessa cadastros de voluntários.
// Ele existe só para nenhuma função quebrar ao tentar lê-lo.
const dados = { user: null, animais: [], adocoes: [], voluntarios: [], eventos: [], solicitacoesEventos: [], relatoriosEventos: [] };
const filtrosRelatorio = { inicio: "", fim: "", especie: "", local: "" };
let filtroPedidos = "pendentes";
let buscaAnimais = "";
let paginaAtual = "animais";

/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = (id) => document.getElementById(id);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
}

function aviso(texto, erro = false) {
  const t = $("toast");
  t.textContent = texto;
  t.style.background = erro ? "#b42318" : "#472056";
  t.classList.remove("oculto");
  clearTimeout(aviso.timer);
  aviso.timer = setTimeout(() => t.classList.add("oculto"), 3200);
}

function abrirModal(id) { $(id).classList.replace("hidden", "flex"); }
function fecharModal(id) { $(id).classList.replace("flex", "hidden"); }

function confirmar(texto) {
  return new Promise((resolve) => {
    $("confirmarTexto").textContent = texto;
    abrirModal("modalConfirmar");
    const fim = (r) => { fecharModal("modalConfirmar"); resolve(r); };
    $("confirmarSim").onclick = () => fim(true);
    $("confirmarNao").onclick = () => fim(false);
  });
}

function dataBR(iso) {
  if (!iso) return "—";
  const [a, m, d] = String(iso).slice(0, 10).split("-");
  return d ? `${d}/${m}/${a}` : iso;
}

// Faz a chamada à API e devolve o JSON (ou lança erro com a mensagem do servidor)
async function api(caminho, opcoes = {}) {
  const resposta = await fetch(API + caminho, {
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    ...opcoes
  });
  const json = await resposta.json().catch(() => ({}));
  if (resposta.status === 401) {
    location.href = "login.html?next=painel-voluntario.html";
    throw new Error("Sessão expirada.");
  }
  if (!resposta.ok) throw new Error(json.message || "Algo deu errado.");
  return json;
}

function vazio(texto) {
  return `<div class="rounded-2xl bg-white p-8 text-center text-on-surface-variant">
    <span class="material-symbols-outlined text-4xl text-secondary">inbox</span>
    <p class="mt-2 font-semibold">${esc(texto)}</p></div>`;
}

function titulo(texto, sub, botao = "") {
  return `<header class="mb-6 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div><h1 class="text-2xl font-bold text-primary md:text-3xl">${esc(texto)}</h1>
    ${sub ? `<p class="mt-1 text-on-surface-variant">${esc(sub)}</p>` : ""}</div>${botao}</header>`;
}

function botaoPrincipal(texto, icone, acao) {
  return `<button type="button" onclick="${acao}" class="inline-flex items-center justify-center gap-2 rounded-full bg-primary-container px-5 py-3 font-semibold text-white hover:bg-primary">
    <span class="material-symbols-outlined">${icone}</span>${esc(texto)}</button>`;
}

const STATUS_ANIMAL = {
  "disponível": ["Disponível", "bg-green-100 text-green-800"],
  "em adoção":  ["Em adoção", "bg-amber-100 text-amber-800"],
  "adotado":    ["Adotado", "bg-surface-variant text-on-surface-variant"]
};

const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const DIAS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

const hojeISO = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Sao_Paulo" });
const adotados = () => dados.animais.filter((a) => a.status === "adotado");
const adotadosDoMes = () => adotados().filter((a) => (a.adopted_at || "").slice(0, 7) === hojeISO().slice(0, 7));

/* ============================================================
   CARREGAR DADOS
   ============================================================ */
async function carregarTudo() {
  const [animais, adocoes, eventos, solicitacoesEventos, relatoriosEventos] = await Promise.allSettled([
    api("/animals"), api("/applications"), api("/events"), api("/event-requests"), api("/event-reports")
  ]);
  const lista = (r) => (r.status === "fulfilled" && Array.isArray(r.value) ? r.value : []);
  dados.animais = lista(animais);
  dados.adocoes = lista(adocoes);
  dados.eventos = lista(eventos);
  dados.solicitacoesEventos = lista(solicitacoesEventos);
  dados.relatoriosEventos = lista(relatoriosEventos);

  // Mostra no console se alguma informação não pôde ser carregada (ex.: sem permissão)
  [["animais", animais], ["solicitações", adocoes], ["eventos", eventos]].forEach(([nome, r]) => {
    if (r.status === "rejected") console.warn(`Não foi possível carregar ${nome}:`, r.reason?.message);
  });

  desenhar();
}

/* ============================================================
   PÁGINA — ANIMAIS
   ============================================================ */
function paginaAnimais() {
  const botao = `<a href="adicionar-animal.html" class="inline-flex items-center justify-center gap-2 rounded-full bg-primary-container px-5 py-3 font-semibold text-white hover:bg-primary">
    <span class="material-symbols-outlined">add</span>Cadastrar animal</a>`;

  const ativos = dados.animais.filter((a) => a.status !== "adotado");
  const qtdAdotados = dados.animais.length - ativos.length;
  const sub = `${ativos.length} para adoção` + (qtdAdotados ? ` • ${qtdAdotados} já adotado(s)` : "");
  const termo = buscaAnimais.trim().toLocaleLowerCase("pt-BR");
  const filtrados = ativos.filter((a) => String(a.name || "").toLocaleLowerCase("pt-BR").includes(termo));

  return titulo("Animais", sub, botao) + `
    <div class="mb-6 rounded-2xl bg-white p-4 shadow-sm">
      <label for="buscaAnimais" class="mb-2 block font-semibold text-primary">Buscar animal pelo nome</label>
      <div class="relative">
        <span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-secondary" aria-hidden="true">search</span>
        <input id="buscaAnimais" type="search" value="${esc(buscaAnimais)}" oninput="atualizarBuscaAnimais(this.value)"
          class="campo w-full pl-11 text-base" placeholder="Digite o nome do animal" autocomplete="off">
      </div>
      <p class="mt-2 text-sm text-on-surface-variant">${filtrados.length} resultado(s) encontrado(s)</p>
    </div>
    <div class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3">
      ${filtrados.length
        ? filtrados.map(cartaoAnimal).join("")
        : `<div class="sm:col-span-2 xl:col-span-3">${vazio(ativos.length ? "Nenhum animal encontrado com esse nome." : "Nenhum animal para adoção no momento.")}</div>`}
    </div>`;
}

// Card grande: foto em cima, informações e botões embaixo
function cartaoAnimal(a) {
  const id = esc(a.id);
  const temFoto = Boolean(a.image);
  const emAdocao = a.status === "em adoção";

  return `
  <article class="flex flex-col overflow-hidden rounded-3xl border border-surface-variant bg-white shadow-sm transition hover:shadow-md">
    <div class="relative aspect-[4/3] bg-surface-low">
      <img src="${esc(a.image || "assets/logo-footer.png")}" alt="Foto de ${esc(a.name || "animal")}"
        class="h-full w-full ${temFoto ? "object-cover" : "object-contain p-10"}"
        onerror="this.onerror=null;this.src='assets/logo-footer.png';this.className='h-full w-full object-contain p-10'">
      ${emAdocao ? `<span class="absolute left-3 top-3 rounded-full bg-amber-100 px-3 py-1 text-sm font-semibold text-amber-800 shadow-sm">Em processo de adoção</span>` : ""}
    </div>

    <div class="flex flex-1 flex-col p-5">
      <h3 class="text-2xl font-bold leading-tight text-primary">${esc(a.name || "Sem nome")}</h3>
      <p class="mt-1 text-base text-on-surface-variant">${esc([a.species, a.age, a.sex].filter(Boolean).join(" • "))}</p>
      ${a.responsible_person
        ? `<p class="mt-3 flex items-center gap-2 text-base"><span class="material-symbols-outlined text-[20px] text-secondary">person</span>Responsável: <strong>${esc(a.responsible_person)}</strong></p>`
        : ""}

      <div class="mt-auto grid grid-cols-2 gap-2 pt-5">
        <button type="button" onclick="editarAnimal('${id}')"
          class="inline-flex items-center justify-center gap-1.5 rounded-full bg-primary-fixed py-2.5 font-semibold text-primary hover:bg-secondary-container">
          <span class="material-symbols-outlined text-[18px]">edit</span>Editar
        </button>
        <a href="detalhes-animal.html?id=${encodeURIComponent(a.id)}" target="_blank"
          class="inline-flex items-center justify-center gap-1.5 rounded-full border border-secondary py-2.5 font-semibold text-secondary hover:bg-surface-low">
          <span class="material-symbols-outlined text-[18px]">open_in_new</span>Ver no site
        </a>
        <button type="button" onclick="removerAnimal('${id}')"
          class="col-span-2 mt-1 inline-flex items-center justify-center gap-1.5 rounded-full py-2 text-sm font-semibold text-red-700 hover:bg-red-50">
          <span class="material-symbols-outlined text-[18px]">delete</span>Deletar perfil
        </button>
      </div>
    </div>
  </article>`;
}

function atualizarBuscaAnimais(valor) {
  buscaAnimais = valor;
  desenhar();
  const campo = $("buscaAnimais");
  if (campo) {
    campo.focus();
    campo.setSelectionRange(valor.length, valor.length);
  }
}

// Barras horizontais simples: [["rótulo", número], ...]
function barras(lista, vazioTexto = "Sem dados ainda.") {
  const maior = Math.max(0, ...lista.map(([, n]) => n));
  if (!maior) return `<p class="text-sm text-on-surface-variant">${vazioTexto}</p>`;
  return `<div class="space-y-2">${lista.map(([rotulo, n]) => `
    <div class="flex items-center gap-3 text-sm">
      <span class="w-24 shrink-0 truncate text-on-surface-variant">${esc(rotulo)}</span>
      <div class="h-6 flex-1 overflow-hidden rounded-full bg-surface-low">
        <div class="h-full rounded-full bg-primary-container" style="width:${n ? Math.max(6, (n / maior) * 100) : 0}%"></div>
      </div>
      <span class="w-6 shrink-0 text-right font-bold text-primary">${n}</span>
    </div>`).join("")}</div>`;
}


/* ============================================================
   ARQUIVOS ENVIADOS (documentos, fotos, vídeos, termo assinado)
   O navegador bloqueia abrir "data:" direto numa aba nova.
   Por isso o arquivo é convertido num endereço temporário (blob)
   antes de abrir, e o download usa o nome original.
   ============================================================ */
let ARQUIVOS = [];

function registrarArquivo(arquivo) {
  ARQUIVOS.push(arquivo);
  return ARQUIVOS.length - 1;
}

async function abrirArquivo(indice) {
  const arquivo = ARQUIVOS[indice];
  if (!arquivo?.data) return aviso("Este arquivo não está disponível.", true);

  // Abre a aba já no clique (senão o navegador bloqueia como pop-up)
  const janela = window.open("", "_blank");
  try {
    const blob = await (await fetch(arquivo.data)).blob();
    const url = URL.createObjectURL(blob);
    if (janela) {
      janela.location.href = url;
    } else {
      location.href = url;
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (erro) {
    janela?.close();
    aviso("Não foi possível abrir o arquivo. Tente baixar.", true);
  }
}

function baixarArquivo(indice) {
  const arquivo = ARQUIVOS[indice];
  if (!arquivo?.data) return aviso("Este arquivo não está disponível.", true);
  const link = document.createElement("a");
  link.href = arquivo.data;
  link.download = arquivo.nome || "arquivo";
  document.body.appendChild(link);
  link.click();
  link.remove();
}

// Normaliza os nomes dos campos: {nome|name, tipo|type, data}
function normalizarArquivo(a) {
  if (!a) return null;
  const data = typeof a.data === "string" && a.data.startsWith("data:") ? a.data : "";
  const tipo = String(a.tipo || a.type || (data.match(/^data:([^;,]+)/) || [])[1] || "");
  return { nome: a.nome || a.name || "Arquivo", tipo, tamanho: Number(a.tamanho || a.size || 0), data };
}

function tamanhoLegivel(bytes) {
  if (!bytes) return "";
  if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

// Card de um arquivo, com miniatura (imagem) ou ícone, e botões Abrir / Baixar
function cartaoArquivo(bruto) {
  const a = normalizarArquivo(bruto);
  if (!a) return "";

  if (!a.data) {
    return `<div class="flex items-center gap-3 rounded-xl bg-white p-3 text-sm ring-1 ring-surface-variant">
      <span class="material-symbols-outlined text-on-surface-variant">draft</span>
      <div class="min-w-0"><p class="truncate font-semibold">${esc(a.nome)}</p>
      <p class="text-xs text-on-surface-variant">Só o nome foi salvo. O arquivo não chegou ao servidor.</p></div>
    </div>`;
  }

  const i = registrarArquivo(a);
  const imagem = a.tipo.startsWith("image/");
  const icone = a.tipo === "application/pdf" ? "picture_as_pdf" : a.tipo.startsWith("video/") ? "movie" : "description";

  return `<div class="flex items-center gap-3 rounded-xl bg-white p-3 ring-1 ring-surface-variant">
    ${imagem
      ? `<button type="button" onclick="abrirArquivo(${i})" class="shrink-0" title="Abrir ${esc(a.nome)}"><img src="${a.data}" alt="${esc(a.nome)}" class="h-16 w-16 rounded-lg object-cover"></button>`
      : `<span class="grid h-16 w-16 shrink-0 place-items-center rounded-lg bg-primary-fixed text-primary"><span class="material-symbols-outlined text-3xl">${icone}</span></span>`}
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-semibold">${esc(a.nome)}</p>
      <p class="text-xs text-on-surface-variant">${esc(a.tipo || "arquivo")}${a.tamanho ? " • " + tamanhoLegivel(a.tamanho) : ""}</p>
      <div class="mt-2 flex gap-2">
        <button type="button" onclick="abrirArquivo(${i})" class="inline-flex items-center gap-1 rounded-full bg-primary-container px-3 py-1.5 text-xs font-semibold text-white hover:bg-primary">
          <span class="material-symbols-outlined text-[16px]">open_in_new</span>Abrir
        </button>
        <button type="button" onclick="baixarArquivo(${i})" class="inline-flex items-center gap-1 rounded-full border border-primary-container px-3 py-1.5 text-xs font-semibold text-primary hover:bg-surface-low">
          <span class="material-symbols-outlined text-[16px]">download</span>Baixar
        </button>
      </div>
    </div>
  </div>`;
}

// Nome de quem marcou a solicitação como resolvida
function quemResolveu(p) {
  if (p.resolved_by_name) return p.resolved_by_name;
  const id = p.resolved_by || p.reviewed_by;
  if (id && dados.user && String(id) === String(dados.user.id)) {
    return dados.user.name || dados.user.nome || "Você";
  }
  return "não registrado";
}

// Transforma "(11) 99999-9999" em "5511999999999" para o link do WhatsApp
function numeroWhatsApp(telefone) {
  let n = String(telefone || "").replace(/\D/g, "");
  if (n.length === 10 || n.length === 11) n = "55" + n;
  return n.length >= 12 ? n : "";
}

    const data = String(valor || "").slice(0, 10);

    return acc;
  }, {});
  const adocoesPeriodo = dados.animais.filter((a) =>
    a.status === "adotado"
    && dentroDoPeriodo(a.adopted_at)
    && (!filtrosRelatorio.especie || String(a.species || "") === filtrosRelatorio.especie)
    && (!filtrosRelatorio.local || zonaPorAnimal[String(a.id)] === filtrosRelatorio.local)

  const disponiveis = dados.animais.filter((a) => a.status !== "adotado");

/* ============================================================
   PÁGINA — EVENTOS
   Resultados: filhotes e adultos, cães e gatos
   ============================================================ */
function contagensEvento(e) {
  const r = e.results || {};
  const n = (v) => Math.max(0, Math.floor(Number(v) || 0));
  return {
    puppies_dogs: n(r.puppies_dogs),
    puppies_cats: n(r.puppies_cats),
    adult_dogs: n(r.adult_dogs),
    adult_cats: n(r.adult_cats)
  };
}

const somaContagens = (c) => c.puppies_dogs + c.puppies_cats + c.adult_dogs + c.adult_cats;

function lerResultados(id) {
  const v = (chave) => Math.max(0, Math.floor(Number($(`evento-${id}-${chave}`)?.value) || 0));
  return {
    puppies_dogs: v("puppies_dogs"),
    puppies_cats: v("puppies_cats"),
    adult_dogs: v("adult_dogs"),
    adult_cats: v("adult_cats")
  };
}

function atualizarTotalEvento(id) {
  $(`evento-${id}-total`).textContent = somaContagens(lerResultados(id));
}

function ajustarResultado(id, chave, passo) {
  const campo = $(`evento-${id}-${chave}`);
  campo.value = Math.max(0, (Number(campo.value) || 0) + passo);
  atualizarTotalEvento(id);
}

          ${contador("puppies_dogs", "filhotes de cachorro")}

async function finalizarEvento(id) {
  const c = lerResultados(id);

  // Guarda o detalhe e também os totais que os Relatórios já usavam
  const results = {
    ...c,
    puppies: c.puppies_dogs + c.puppies_cats,
    adults: c.adult_dogs + c.adult_cats,
    dogs: c.puppies_dogs + c.adult_dogs,
    cats: c.puppies_cats + c.adult_cats
  };
  results.animals_adopted = results.dogs + results.cats;

  if (!(await confirmar(`Fechar o evento com ${results.animals_adopted} adoção(ões)?`))) return;

  try {
    const r = await api(`/events/${encodeURIComponent(id)}`, { method: "PUT", body: JSON.stringify({ results }) });
    const evento = dados.eventos.find((item) => String(item.id) === String(id));
    if (evento) Object.assign(evento, r.event || { results });
    desenhar();
    aviso("Evento fechado. Os resultados já entram nos relatórios.");
  } catch (erro) {
    aviso(erro.message, true);
  }
}

function desenhar() {
  ARQUIVOS = [];
  $("conteudo").innerHTML = (RENDER[paginaAtual] || paginaAnimais)();

  document.querySelectorAll(".item-menu").forEach((b) => {
    const ativo = b.dataset.ir === paginaAtual;
    b.classList.toggle("bg-white/20", ativo);
    b.classList.toggle("font-bold", ativo);
    b.classList.toggle("text-white", ativo);
    b.classList.toggle("text-white/75", !ativo);
  });
  document.querySelectorAll(".item-inferior").forEach((b) => {
    const ativo = b.dataset.ir === paginaAtual;
    b.classList.toggle("bg-primary-container", ativo);
    b.classList.toggle("text-white", ativo);
    b.classList.toggle("text-on-surface-variant", !ativo);
  });

  const nome = dados.user?.name || dados.user?.nome || "";
  document.querySelectorAll("[data-nome]").forEach((el) => (el.textContent = nome));
  document.querySelectorAll("[data-foto]").forEach((el) => (el.src = dados.user?.profile_photo || "assets/logo-footer.png"));

  const partes = String(nome).trim().split(/\s+/).filter(Boolean);
  const iniciais = partes.length
    ? (partes[0][0] + (partes.length > 1 ? partes[partes.length - 1][0] : "")).toUpperCase()
    : "V";

      ? `<img src="${esc(dados.user.profile_photo)}" alt="Foto de perfil" class="h-full w-full object-cover">`
      : esc(iniciais);
  });
}

function editarAnimal(id) {
  const a = dados.animais.find((x) => String(x.id) === String(id));
  if (!a) return;
  $("animalId").value = a.id;
  $("animalTitulo").textContent = a.name || "Animal";
  $("animalStatus").value = STATUS_ANIMAL[a.status] ? a.status : "disponível";
  $("animalResponsavel").value = a.responsible_person || "";
  $("animalDescricao").value = a.description || "";
  $("animalPcd").checked = Boolean(a.pcd);
  abrirModal("modalAnimal");
}

async function salvarAnimal() {
  const id = $("animalId").value;
  const botao = $("btnSalvarAnimal");
  botao.disabled = true;
  try {
    const r = await api(`/animals/${encodeURIComponent(id)}`, {
      method: "PUT",
      body: JSON.stringify({
        status: $("animalStatus").value,
        responsible_person: $("animalResponsavel").value.trim(),
        description: $("animalDescricao").value.trim(),
        pcd: $("animalPcd").checked
      })
    });
    const i = dados.animais.findIndex((x) => String(x.id) === String(id));
    if (i >= 0) dados.animais[i] = r.animal;
    fecharModal("modalAnimal");
    desenhar();
    aviso("Animal atualizado.");
  } catch (erro) {
    aviso(erro.message, true);
  } finally {
    botao.disabled = false;
  }
}

async function removerAnimal(id) {
  const animal = dados.animais.find((item) => String(item.id) === String(id));
  if (!animal || !(await confirmar(`Deletar o perfil de ${animal.name || "este animal"}? Esta ação não pode ser desfeita.`))) return;
  try {
    await api(`/animals/${encodeURIComponent(id)}`, { method: "DELETE" });
    dados.animais = dados.animais.filter((item) => String(item.id) !== String(id));
    fecharModal("modalAnimal");
    desenhar();
    aviso("Perfil do animal deletado.");
  } catch (erro) {
    aviso(erro.message, true);
  }
}

/* ============================================================
   AÇÕES — EVENTOS
   ============================================================ */
async function salvarEvento() {
  const valor = (id) => $(id).value.trim();
  const evento = {
    title: valor("evTitulo"), description: valor("evDescricao"),
    date: valor("evData"), startTime: valor("evInicio"), endTime: valor("evFim"),
    location: valor("evLocal"), spaceDescription: valor("evEspaco"),
    animalLimit: Number(valor("evAnimais")), volunteerLimit: Number(valor("evVoluntarios")),
    spaceLimit: Number(valor("evCapacidade"))
  };

  if (Object.values(evento).some((v) => v === "" || v === 0)) return aviso("Preencha todos os campos.", true);
  if (evento.endTime <= evento.startTime) return aviso("O horário de fim precisa ser depois do início.", true);

  const botao = $("btnSalvarEvento");
  botao.disabled = true;
  try {
    const r = await api("/events", { method: "POST", body: JSON.stringify(evento) });
    dados.eventos.push(r.event);
    dados.eventos.sort((a, b) => `${a.date}${a.startTime}`.localeCompare(`${b.date}${b.startTime}`));
    ["evTitulo", "evDescricao", "evData", "evInicio", "evFim", "evLocal", "evEspaco"].forEach((id) => ($(id).value = ""));
    fecharModal("modalEvento");
    irPara("eventos");
    aviso("Evento publicado.");
  } catch (erro) {
    aviso(erro.message, true);
  } finally {
    botao.disabled = false;
  }
}

async function excluirEvento(id) {
  if (!(await confirmar("Excluir este evento? Essa ação não pode ser desfeita."))) return;
  try {
    await api(`/events/${encodeURIComponent(id)}`, { method: "DELETE" });
    dados.eventos = dados.eventos.filter((e) => String(e.id) !== String(id));
    desenhar();
    aviso("Evento excluído.");
  } catch (erro) {
    aviso(erro.message, true);
  }
}

  if (!senhaAtual || !novaSenha) return aviso("Preencha a senha atual e a nova.", true);

  if (await atualizarPerfil({ senhaAtual, novaSenha }, "Senha alterada.")) {
    ["cfgSenhaAtual", "cfgSenhaNova", "cfgSenhaConfirma"].forEach((id) => ($(id).value = ""));
  }
}

// Reduz a foto para 512px antes de enviar
function reduzirFoto(arquivo) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(arquivo);
    img.onload = () => {
      const escala = Math.min(1, 512 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * escala);
      c.height = Math.round(img.height * escala);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => reject(new Error("Não foi possível abrir essa imagem."));
    img.src = url;
  });
}

async function trocarFoto(input) {
  const arquivo = input.files?.[0];
  if (!arquivo) return;
  try {
    atualizarPerfil({ profile_photo: await reduzirFoto(arquivo) }, "Foto atualizada.");
  } catch (erro) {
    aviso(erro.message, true);
  }
}

async function removerFoto() {
  if (await confirmar("Remover sua foto de perfil?")) atualizarPerfil({ profile_photo: null }, "Foto removida.");
}

async function sair() {
  try { await fetch(API + "/auth/logout", { method: "POST", credentials: "same-origin" }); } catch {}
  localStorage.removeItem("pa_account_name");
  localStorage.removeItem("volunteer_name");
  localStorage.removeItem("volunteer_email");
  localStorage.removeItem("volunteer_id");
  location.href = "login.html";
}


async function excluirMinhaContaApoio() {
  if (!(await confirmar("Excluir sua conta de apoio? Você perde o acesso ao sistema. Animais e eventos continuam no histórico."))) return;
  const senhaAtual = window.prompt("Digite sua senha atual para confirmar:");
  if (senhaAtual === null) return;
  const confirmacao = window.prompt("Digite EXCLUIR para confirmar:");
  if (confirmacao === null) return;
  try {
    const resposta = await fetch(API + "/auth/volunteer-account", {
      method: "DELETE",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ senhaAtual, confirmacao })
    });
    const resultado = await resposta.json().catch(() => ({}));
    if (!resposta.ok) throw new Error(resultado.message || "Não foi possível excluir a conta.");
    window.alert("Sua conta de apoio foi excluída.");
    location.replace("login.html");
  } catch (erro) {
    aviso(erro.message, true);
  }
}

/* ============================================================
   JANELAS: fechar ao clicar fora ou apertar Esc
   ============================================================ */
const MODAIS = ["modalAnimal", "modalEvento"];

MODAIS.forEach((id) =>
  $(id).addEventListener("click", (e) => { if (e.target.id === id) fecharModal(id); })
);

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") MODAIS.forEach(fecharModal);
});

/* ============================================================
   INÍCIO — confere se quem abriu é uma conta de apoio
   ============================================================ */
(async () => {
  montarMenus();
  try {
    const me = await fetch(API + "/auth/me", { credentials: "same-origin" }).then((r) => r.json());
    if (!me.ok || me.user_type !== "volunteer") throw new Error();
    dados.user = me.user;
  } catch {
    location.href = "login.html?next=painel-voluntario.html";
    return;
  }
  $("verificando").remove();
  desenhar();
  carregarTudo();
})();
</script>
