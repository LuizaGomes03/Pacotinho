<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esqueci minha senha — Pacotinho de Amor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>body{font-family:Montserrat,sans-serif;background:#fef7ff}</style>
</head>
<body class="min-h-screen flex flex-col">
<header class="border-b border-[#E7E0E8] bg-[#FEF7FF]"><div class="max-w-6xl mx-auto px-5 py-4 flex items-center gap-3"><img src="assets/logo-footer.png" alt="Pacotinho de Amor" class="w-11 h-11 rounded-full"><strong class="text-[#472056] text-lg">Pacotinho de Amor</strong></div></header>
<main class="flex-1 flex items-center justify-center px-5 py-12">
<section class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-[#E7E0E8] p-6 md:p-8">
<h1 class="text-2xl font-bold text-[#472056]">Esqueci minha senha</h1>
<p class="text-sm text-[#625A64] mt-2 leading-6">Digite o e-mail cadastrado como voluntário. Enviaremos um link para o WhatsApp informado no cadastro para você criar uma nova senha.</p>
<form id="form" class="mt-6 space-y-5">
<div><label for="email" class="block text-sm font-bold text-[#1D1A20] mb-2">E-mail</label><input id="email" type="email" required autocomplete="email" placeholder="Digite seu e-mail" class="w-full rounded-xl border border-[#CFC3CE] px-4 py-3 text-base focus:border-[#5F376E] focus:ring-2 focus:ring-[#5F376E]/15 focus:outline-none"></div>
<div id="message" class="hidden rounded-xl px-4 py-3 text-sm" role="alert"></div>
<button id="button" class="w-full rounded-xl bg-[#5F376E] text-white py-3.5 font-bold">Enviar link pelo WhatsApp</button>
</form>
<div class="mt-5 text-center"><a href="login.html" class="text-sm font-semibold text-[#5F376E] hover:underline">Voltar para o login</a></div>
</section></main>
<script>
(() => {
 const API=location.port==='8000'?'/api':'http://127.0.0.1:8000/api';
 const form=document.getElementById('form'), msg=document.getElementById('message'), btn=document.getElementById('button');
 form.addEventListener('submit',async e=>{
  e.preventDefault(); msg.className='hidden'; btn.disabled=true; btn.textContent='Enviando...';
  const email=document.getElementById('email').value.trim().toLowerCase();
  try{
   const r=await fetch(`${API}/auth/volunteer-password-help?email=${encodeURIComponent(email)}`);
   const d=await r.json().catch(()=>({}));
   if(!r.ok||!d.ok) throw new Error(d.message||'Não foi possível solicitar a recuperação.');
   msg.textContent=d.message||'Se o e-mail estiver cadastrado, enviaremos o link pelo WhatsApp.';
   msg.className='rounded-xl px-4 py-3 text-sm bg-[#F3FBF4] text-green-700 border border-green-200';
  }catch(err){msg.textContent=err.message||'Não foi possível solicitar a recuperação.';msg.className='rounded-xl px-4 py-3 text-sm bg-red-50 text-red-700 border border-red-200';}
  finally{btn.disabled=false;btn.textContent='Enviar link pelo WhatsApp';}
 });
})();
</script>
</body>
</html>
