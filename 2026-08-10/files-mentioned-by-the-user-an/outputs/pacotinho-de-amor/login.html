<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Área voluntária — Pacotinho de Amor</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet"
  >

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#472056",
            "primary-container": "#5f376e",
            "primary-fixed": "#f9d8ff",
            secondary: "#78517a",
            background: "#fef7ff",
            "on-surface": "#1d1a20",
            "on-surface-variant": "#4c444d",
            outline: "#7e747e",
            "outline-variant": "#cfc3ce",
            "surface-variant": "#e7e0e8"
          },
          fontFamily: {
            sans: ["Montserrat", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    a:focus-visible,
    button:focus-visible {
      outline: 3px solid #e7b5f6;
      outline-offset: 3px;
    }
  </style>

  <link rel="stylesheet" href="shared.css">
</head>

<body class="min-h-screen bg-background font-sans text-on-surface">

  <main class="flex min-h-[calc(100vh-160px)] w-full items-center justify-center px-4 py-10 md:px-8">

    <section class="w-full max-w-[440px] rounded-2xl bg-white p-6 shadow-[0_8px_30px_rgba(95,55,110,0.10)] md:p-8">

      <div class="mb-6 text-center">

        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-primary-fixed">
          <span class="material-symbols-outlined text-[28px] text-primary">
            volunteer_activism
          </span>
        </div>

        <h1 class="text-2xl font-bold text-primary">
          Área voluntária
        </h1>

        <p class="mt-1 text-sm text-on-surface-variant">
          Entre com o e-mail e a senha da sua conta de voluntário(a).
        </p>

      </div>

      <form id="loginForm" class="space-y-4" novalidate>

        <div>
          <label for="email" class="mb-1.5 block text-sm font-semibold">
            E-mail
          </label>

          <div class="relative">
            <span
              aria-hidden="true"
              class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline"
            >
              mail
            </span>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="seuemail@exemplo.com"
              class="w-full rounded-xl border border-outline-variant bg-white py-3 pl-11 pr-4 text-base focus:border-primary-container focus:outline-none focus:ring-2 focus:ring-primary-container/15"
            >
          </div>
        </div>

        <div>

          <div class="mb-1.5 flex items-center justify-between">
            <label for="password" class="block text-sm font-semibold">
              Senha
            </label>

            <a
              href="recuperar-senha-voluntario.html"
              class="text-xs font-semibold text-secondary hover:text-primary hover:underline"
            >
              Esqueci minha senha
            </a>
          </div>

          <div class="relative">

            <span
              aria-hidden="true"
              class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline"
            >
              lock
            </span>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Digite sua senha"
              class="w-full rounded-xl border border-outline-variant bg-white py-3 pl-11 pr-12 text-base focus:border-primary-container focus:outline-none focus:ring-2 focus:ring-primary-container/15"
            >

            <button
              type="button"
              id="mostrarSenha"
              aria-label="Mostrar senha"
              class="absolute right-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full text-outline hover:bg-background"
            >
              <span class="material-symbols-outlined text-[20px]">
                visibility
              </span>
            </button>

          </div>
        </div>

        <div
          id="loginMessage"
          role="alert"
          aria-live="polite"
          class="hidden"
        ></div>

        <button
          id="loginButton"
          type="submit"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary-container px-4 py-3.5 font-semibold text-white transition hover:bg-primary disabled:opacity-60"
        >
          <span id="loginButtonText">Entrar</span>

          <span class="material-symbols-outlined text-[20px]">
            arrow_forward
          </span>
        </button>

      </form>

      <div class="mt-6 space-y-2 border-t border-surface-variant pt-5 text-center text-sm">

        <p class="text-on-surface-variant">
          Ainda não tem uma conta?

          <a
            href="cadastro.html"
            class="font-semibold text-primary hover:underline"
          >
            Cadastre-se
          </a>
        </p>

        <a
          href="home.html"
          class="inline-block font-semibold text-primary hover:underline"
        >
          Voltar para o início
        </a>

      </div>

    </section>

  </main>

  <script src="shared.js"></script>

  <script>
    (() => {

      /*
       * O mesmo login funciona pelo servidor Python na porta 8000
       * ou pelo Live Server.
       */
      const API =
        location.port === "8000"
          ? "/api"
          : "http://127.0.0.1:8000/api";

      const form = document.getElementById("loginForm");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const message = document.getElementById("loginMessage");
      const button = document.getElementById("loginButton");
      const buttonText = document.getElementById("loginButtonText");
      const toggle = document.getElementById("mostrarSenha");

      /*
       * Permite voltar para uma página interna depois do login.
       * Exemplo:
       * login.html?next=painel-voluntario.html
       */
      function destinoSeguro(padrao) {

        const next =
          new URLSearchParams(location.search).get("next") || "";

        /*
         * Aceita somente páginas HTML do próprio projeto.
         * Não permite URLs externas.
         */
        const permitido =
          /^[\w-]+\.html(?:\?[\w=&%.-]*)?$/.test(next);

        return permitido ? next : padrao;
      }

      function mostrarErro(texto) {

        message.textContent = texto;

        message.className =
          "rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700";
      }

      function limparErro() {

        message.textContent = "";
        message.className = "hidden";
      }

      toggle.addEventListener("click", () => {

        const visivel =
          password.type === "text";

        password.type =
          visivel ? "password" : "text";

        toggle.setAttribute(
          "aria-label",
          visivel ? "Mostrar senha" : "Ocultar senha"
        );

        toggle.querySelector("span").textContent =
          visivel ? "visibility" : "visibility_off";
      });

      [email, password].forEach((campo) => {
        campo.addEventListener("input", limparErro);
      });

      form.addEventListener("submit", async (event) => {

        event.preventDefault();
        limparErro();

        const emailValor =
          email.value.trim().toLowerCase();

        const senhaValor =
          password.value;

        if (!emailValor || !senhaValor) {

          mostrarErro(
            "Preencha o e-mail e a senha."
          );

          (emailValor ? password : email).focus();

          return;
        }

        button.disabled = true;
        buttonText.textContent = "Entrando...";

        try {

          /*
           * MASTER e VOLUNTÁRIO
           *
           * O backend atual usa /api/auth/login para os dois.
           */
          const resposta = await fetch(
            `${API}/auth/login`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              credentials: "include",
              body: JSON.stringify({
                email: emailValor,
                password: senhaValor
              })
            }
          );

          const dados =
            await resposta.json().catch(() => ({}));

          if (!resposta.ok || !dados.ok) {

            throw new Error(
              dados.message ||
              "E-mail ou senha inválidos."
            );
          }

          /*
           * Confirma com o servidor qual conta entrou.
           */
          const me =
            await fetch(
              `${API}/auth/me`,
              {
                credentials: "include"
              }
            );

          const sessao =
            await me.json().catch(() => ({}));

          if (!me.ok || !sessao.ok) {

            throw new Error(
              "Não foi possível confirmar sua sessão."
            );
          }

          const tipo =
            String(
              sessao.user_type || ""
            ).toLowerCase();

          const user =
            sessao.user ||
            dados.user ||
            {};

          /*
           * CONTA MASTER
           */
          if (tipo === "master") {

            localStorage.setItem(
              "master_name",
              user.name || user.nome || ""
            );

            localStorage.setItem(
              "master_email",
              user.email || ""
            );

            localStorage.setItem(
              "master_id",
              user.id || ""
            );

            location.href =
              destinoSeguro("painel-master.html");

            return;
          }

          /*
           * CONTA VOLUNTÁRIO
           */
          if (tipo === "volunteer") {

            localStorage.setItem(
              "volunteer_name",
              user.name || user.nome || ""
            );

            localStorage.setItem(
              "volunteer_email",
              user.email || ""
            );

            localStorage.setItem(
              "volunteer_id",
              user.id || ""
            );

            location.href =
              destinoSeguro("painel-voluntario.html");

            return;
          }

          /*
           * O cadastro de adotante possui outro login:
           * /api/auth/adopter-login.
           *
           * Portanto, esta página continua sendo exclusivamente
           * para Master e voluntário(a).
           */
          throw new Error(
            "Esta página é destinada ao acesso de voluntários e da conta Master."
          );

        } catch (erro) {

          console.error(
            "Erro no login:",
            erro
          );

          const semServidor =
            erro instanceof TypeError;

          mostrarErro(
            semServidor
              ? "Não foi possível falar com o servidor. Verifique se o servidor Python está rodando na porta 8000."
              : (
                  erro.message ||
                  "Não foi possível entrar."
                )
          );

          button.disabled = false;
          buttonText.textContent = "Entrar";
        }

      });

    })();
  </script>

</body>
</html>
