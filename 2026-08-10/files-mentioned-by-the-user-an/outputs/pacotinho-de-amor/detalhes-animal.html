<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do animal — Pacotinho de Amor</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#472056",
            "primary-container": "#5f376e",
            "primary-fixed": "#f9d8ff",
            "on-primary": "#ffffff",
            "secondary": "#78517a",
            "background": "#fef7ff",
            "surface": "#fef7ff",
            "surface-variant": "#e7e0e8",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f8f1f9",
            "surface-container": "#f3ecf4",
            "surface-container-high": "#ede6ee",
            "on-surface": "#1d1a20",
            "on-surface-variant": "#4c444d",
            "tertiary-fixed": "#e9e964",
            "on-tertiary-fixed": "#1d1d00"
          },
          spacing: { xs: "4px", sm: "12px", md: "24px", lg: "48px", xl: "80px", gutter: "24px" },
          fontFamily: { sans: ["Montserrat", "sans-serif"] }
        }
      }
    }
  </script>

  <style>
    a:focus-visible, button:focus-visible { outline: 3px solid #e7b5f6; outline-offset: 3px; }
  </style>

  <link rel="stylesheet" href="shared.css">
</head>

<body class="bg-background text-on-surface font-sans antialiased">

<!-- O header e o footer são inseridos pelo shared.js -->

<main class="mx-auto w-full max-w-[1200px] px-gutter py-md md:py-lg ">

  <a href="animais-para-adocao.html" class="mb-md inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline">
    <span class="material-symbols-outlined text-[18px]">arrow_back</span>
    Voltar para os animais
  </a>

  <!-- CARREGANDO -->
  <div id="carregando" class="grid grid-cols-1 gap-md md:grid-cols-2 animate-pulse">
    <div class="h-[380px] md:h-[520px] rounded-2xl bg-surface-container-high"></div>
    <div class="h-[380px] md:h-[520px] rounded-2xl bg-surface-container-high"></div>
  </div>

  <!-- ERRO -->
  <div id="erro" class="hidden rounded-2xl bg-surface-container-lowest p-lg text-center">
    <h1 class="mb-sm text-2xl font-bold text-primary">Animal não encontrado</h1>
    <p id="erro-texto" class="mb-md text-on-surface-variant">Esse animal pode já ter sido adotado.</p>
    <a href="animais-para-adocao.html" class="inline-flex rounded-full bg-primary px-lg py-sm font-semibold text-on-primary hover:bg-primary-container">
      Ver outros animais
    </a>
  </div>

  <!-- CONTEÚDO -->
  <div id="conteudo" class="hidden">

    <section class="grid grid-cols-1 gap-md md:grid-cols-2 md:gap-lg">

      <!-- Foto inteira, sem cortar -->
      <!-- Foto inteira, no formato original: sem cortes e sem faixas -->
      <div class="flex items-start justify-center">
        <img id="animal-imagem" class="max-h-[560px] w-auto max-w-full rounded-2xl shadow-sm" src="" alt="">
      </div>

      <!-- Informações principais -->
      <div class="flex flex-col justify-center rounded-2xl bg-surface-container-lowest p-md md:p-lg shadow-[0_4px_20px_rgba(0,0,0,0.05)]">
        <p id="animal-especie" class="mb-1 text-sm font-semibold text-secondary"></p>
        <h1 id="animal-nome" class="mb-1 text-4xl md:text-5xl font-bold tracking-tight text-primary"></h1>
        <p id="animal-raca" class="mb-md text-on-surface-variant"></p>

        <div id="animal-tags" class="mb-sm flex flex-wrap gap-xs"></div>
        <p id="animal-saude" class="mb-lg hidden items-center gap-2 text-sm font-semibold text-green-800">
          <span class="material-symbols-outlined text-[20px]">verified</span><span></span>
        </p>

        <div class="space-y-sm">
          <a id="btn-adotar" href="#"
             class="flex w-full items-center justify-center gap-2 rounded-full bg-primary px-md py-3 font-semibold text-on-primary transition hover:bg-primary-container">
            <span class="material-symbols-outlined">pets</span> Quero adotar
          </a>
          <a id="btn-video" href="#"
             class="flex w-full items-center justify-center gap-2 rounded-full border-2 border-primary px-md py-3 font-semibold text-primary transition hover:bg-surface-container-low">
            <span class="material-symbols-outlined">videocam</span> Conhecer por videochamada
          </a>
          <a href="quero-ajudar.html"
             class="flex w-full items-center justify-center gap-2 rounded-full bg-tertiary-fixed px-md py-3 font-semibold text-on-tertiary-fixed transition hover:opacity-90">
            <span class="material-symbols-outlined">volunteer_activism</span> Quero ajudar
          </a>
        </div>
      </div>

    </section>

    <!-- Sobre -->
    <section class="mt-lg max-w-3xl">
      <h2 class="mb-sm text-2xl font-bold text-primary">Sobre <span id="sobre-nome"></span></h2>
      <p id="animal-descricao" class="text-lg leading-relaxed text-on-surface-variant"></p>
    </section>

  </div>

</main>


<script src="shared.js"></script>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const escapeHTML = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[c]));

  function getId(a) {
    if (a?._id && typeof a._id === "object") return a._id.$oid || String(a._id);
    return String(a?._id || a?.id || "");
  }

  function mostrarErro(texto) {
    $("carregando").classList.add("hidden");
    $("erro").classList.remove("hidden");
    if (texto) $("erro-texto").textContent = texto;
  }

  function tag(icone, texto) {
    return `<span class="inline-flex items-center gap-1 rounded-full bg-surface-container-high px-3 py-1 text-sm font-semibold text-on-surface-variant">
              <span class="material-symbols-outlined text-[18px]">${icone}</span>${escapeHTML(texto)}
            </span>`;
  }

  function mostrarAnimal(a) {
    const nome = a.name || "Animal";
    const sexo = String(a.sex || "").toLowerCase();
    const iconeSexo = sexo.startsWith("f") ? "female" : sexo.startsWith("m") ? "male" : "pets";
    const id = encodeURIComponent(getId(a));

    document.title = `${nome} — Pacotinho de Amor`;

    const img = $("animal-imagem");
    img.src = a.image || a.imagem || a.photo || a.foto || "assets/logo-footer.png";
    img.alt = `Foto de ${nome}`;
    img.onerror = () => { img.onerror = null; img.src = "assets/logo-footer.png"; };

    $("animal-especie").textContent = a.species || "";
    $("animal-nome").textContent = nome;
    $("animal-raca").textContent = a.breed || "Sem raça definida";
    $("sobre-nome").textContent = nome;
    $("animal-descricao").textContent = a.description || "Este animal está esperando por uma família cheia de amor.";

    $("animal-tags").innerHTML = [
      a.age && tag("calendar_month", a.age),
      a.sex && tag(iconeSexo, a.sex),
      a.size && tag("straighten", a.size),
      (a.location || a.localizacao) && tag("location_on", a.location || a.localizacao)
    ].filter(Boolean).join("");

    // Saúde: "Castrado, vacinado e vermifugado."
    const saude = $("animal-saude");
    if (a.health) {
      saude.querySelector("span:last-child").textContent = a.health;
      saude.classList.replace("hidden", "flex");
    }

    // Botões levam o id do animal para as próximas páginas
    $("btn-adotar").href = `processo_adocao.html?id=${id}`;
    $("btn-video").href = `agendar-videochamada.html?id=${id}`;

    $("carregando").classList.add("hidden");
    $("conteudo").classList.remove("hidden");
  }

  async function carregar() {
    const id = new URLSearchParams(location.search).get("id");
    if (!id) {
      mostrarErro("Escolha um animal na página de adoção para ver os detalhes.");
      return;
    }

    try {
      const resposta = await fetch("/api/animals", { credentials: "include" });
      if (!resposta.ok) throw new Error("Erro " + resposta.status);

      const data = await resposta.json();
      const lista = Array.isArray(data) ? data : (data.animals || data.data || []);
      const animal = lista.find((a) => getId(a) === id);

      if (!animal) {
        mostrarErro();
        return;
      }

      mostrarAnimal(animal);
    } catch (erro) {
      console.error("Erro ao carregar animal:", erro);
      mostrarErro("Não foi possível carregar as informações agora. Verifique se o servidor está rodando.");
    }
  }

  carregar();
})();
</script>

</body>
</html>
