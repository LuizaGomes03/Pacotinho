<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Entrar — Pacotinho de Amor</title>

  <link rel="stylesheet" href="shared.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #fef7ff;
      color: #1d1a20;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 72px 20px 80px;
    }

    .login-card {
      background: #fff;
      border: 1px solid #e7e0e8;
      border-radius: 22px;
      padding: 40px;
      box-shadow: 0 8px 28px rgba(71, 32, 86, .08);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #78517a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #472056;
      font-size: 30px;
      line-height: 1.2;
    }

    .intro {
      margin: 12px 0 30px;
      color: #5b535d;
      font-size: 15px;
      line-height: 1.65;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 18px;
    }

    label {
      color: #472056;
      font-size: 14px;
      font-weight: 700;
    }

    .required {
      color: #b42318;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      min-height: 49px;
      padding: 12px 14px;
      border: 1px solid #d9d0db;
      border-radius: 11px;
      background: #fff;
      color: #1d1a20;
      font: 500 14px 'Montserrat', sans-serif;
      outline: none;
      transition: .2s ease;
    }

    input:focus {
      border-color: #78517a;
      box-shadow: 0 0 0 3px rgba(120, 81, 122, .12);
    }

    .password-row {
      position: relative;
    }

    .password-row input {
      padding-right: 92px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      min-height: 34px;
      padding: 7px 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #472056;
      font: 700 12px 'Montserrat', sans-serif;
      cursor: pointer;
    }

    .show-password:hover {
      background: #f8f1f9;
    }

    .forgot {
      display: block;
      margin: -4px 0 20px;
      color: #472056;
      font-size: 13px;
      font-weight: 600;
      text-align: right;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .submit {
      width: 100%;
      min-height: 50px;
      padding: 13px 18px;
      border: 0;
      border-radius: 12px;
      background: #472056;
      color: #fff;
      font: 700 14px 'Montserrat', sans-serif;
      cursor: pointer;
      transition: .2s ease;
    }

    .submit:hover {
      background: #5a286d;
      transform: translateY(-1px);
    }

    .message {
      display: none;
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff3f3;
      border: 1px solid #efcaca;
      color: #8b2d2d;
    }

    .message.success {
      display: block;
      background: #f3faf4;
      border: 1px solid #cce6cf;
      color: #27652e;
    }

    .create-account {
      margin: 22px 0 0;
      padding-top: 22px;
      border-top: 1px solid #e7e0e8;
      text-align: center;
      color: #625a64;
      font-size: 13px;
      line-height: 1.6;
    }

    .create-account a {
      color: #472056;
      font-weight: 700;
      text-decoration: none;
    }

    .create-account a:hover {
      text-decoration: underline;
    }

    .privacy-note {
      margin-top: 22px;
      color: #766d77;
      font-size: 11px;
      line-height: 1.55;
      text-align: center;
    }

    .privacy-note a {
      color: #472056;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      main {
        padding: 42px 14px 55px;
      }

      .login-card {
        padding: 28px 18px;
        border-radius: 18px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main>

    <section class="login-card">

      <p class="eyebrow">Área do adotante</p>

      <h1>Bem-vindo(a) de volta</h1>

      <p class="intro">
        Entre na sua conta para acompanhar suas solicitações de adoção
        e as próximas etapas do processo.
      </p>


      <form id="loginAdotante" novalidate>

        <div class="field">

          <label for="email">
            E-mail <span class="required">*</span>
          </label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            placeholder="seu@email.com"
          >

        </div>


        <div class="field">

          <label for="password">
            Senha <span class="required">*</span>
          </label>

          <div class="password-row">

            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="Digite sua senha"
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
              aria-label="Mostrar senha"
            >
              Mostrar
            </button>

          </div>

        </div>


        <a
          class="forgot"
          href="#"
          id="forgotPassword"
        >
          Esqueci minha senha
        </a>


        <div
          id="message"
          class="message"
          role="alert"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          class="submit"
        >
          Entrar
        </button>


        <div class="create-account">

          Ainda não possui uma conta?

          <a href="conta.html">
            Criar minha conta
          </a>

        </div>


        <p class="privacy-note">
          Ao entrar, você continua sujeito aos
          <a href="termos-uso.html">
            Termos de Uso
          </a>
          e à
          <a href="politica-privacidade.html">
            Política de Privacidade
          </a>.
        </p>

      </form>

    </section>

  </main>


  <script src="shared.js"></script>

  <script>
    (() => {

      const form =
        document.getElementById('loginAdotante');

      const email =
        document.getElementById('email');

      const password =
        document.getElementById('password');

      const submit =
        form.querySelector('.submit');

      const message =
        document.getElementById('message');

      const showPassword =
        document.getElementById('showPassword');

      const forgotPassword =
        document.getElementById('forgotPassword');


      function atualizarBotao() {

        submit.disabled = !(
          email.value.trim() &&
          password.value
        );

      }


      function mostrarMensagem(texto, tipo) {

        message.textContent = texto;

        message.className =
          `message ${tipo}`;

      }


      showPassword.addEventListener(
        'click',
        () => {

          const mostrando =
            password.type === 'text';

          password.type =
            mostrando
              ? 'password'
              : 'text';

          showPassword.textContent =
            mostrando
              ? 'Mostrar'
              : 'Ocultar';

          showPassword.setAttribute(
            'aria-label',
            mostrando
              ? 'Mostrar senha'
              : 'Ocultar senha'
          );

        }
      );


      email.addEventListener(
        'input',
        atualizarBotao
      );

      password.addEventListener(
        'input',
        atualizarBotao
      );


      forgotPassword.addEventListener(
        'click',
        (event) => {

          event.preventDefault();

          mostrarMensagem(
            'A recuperação de senha poderá ser disponibilizada por e-mail quando o sistema de contas estiver conectado.',
            'success'
          );

        }
      );


      form.addEventListener(
        'submit',
        async (event) => {

          event.preventDefault();


          if (!form.checkValidity()) {

            form.reportValidity();

            return;

          }


          const emailValue =
            email.value.trim();

          const passwordValue =
            password.value;


          /*
            Quando o backend estiver conectado,
            este ponto deverá enviar as credenciais
            para uma rota segura de autenticação.

            Não armazenamos a senha no navegador
            nem em localStorage.
          */


          if (
            !emailValue ||
            !passwordValue
          ) {

            mostrarMensagem(
              'Preencha seu e-mail e sua senha para continuar.',
              'error'
            );

            return;

          }


          mostrarMensagem(
            'Os dados foram preenchidos. A autenticação será conectada ao sistema de contas quando o backend estiver disponível.',
            'success'
          );

        }
      );


      atualizarBotao();

    })();
  </script>

</body>
</html>
