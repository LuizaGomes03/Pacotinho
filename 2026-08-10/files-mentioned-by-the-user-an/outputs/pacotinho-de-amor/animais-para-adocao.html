<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animais para adoção — Pacotinho de Amor</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-primary": "#ffffff",
            "on-primary-container": "#d5a4e4",
            "secondary-container": "#ffcdfe",
            "secondary": "#78517a",
            "outline": "#7e747e",
            "background": "#fef7ff",
            "secondary-fixed": "#ffd6fc",
            "surface-variant": "#e7e0e8",
            "on-surface-variant": "#4c444d",
            "on-surface": "#1d1a20",
            "surface-container-low": "#f8f1f9",
            "primary-container": "#5f376e",
            "on-background": "#1d1a20",
            "surface": "#fef7ff",
            "primary": "#472056",
            "primary-fixed": "#f9d8ff",
            "surface-container-lowest": "#ffffff",
            "on-secondary-container": "#7b537c",
            "surface-container": "#f3ecf4",
            "surface-container-high": "#ede6ee"
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", "2xl": "1.5rem", full: "9999px" },
          spacing: { xl: "80px", xs: "4px", md: "24px", sm: "12px", lg: "48px", base: "8px", gutter: "24px" },
          fontFamily: {
            "headline-lg": ["Montserrat"], "headline-md": ["Montserrat"], "body-lg": ["Montserrat"],
            "body-md": ["Montserrat"], "label-md": ["Montserrat"], "headline-lg-mobile": ["Montserrat"]
          },
          fontSize: {
            "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }],
            "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
            "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
            "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.5px", fontWeight: "600" }],
            "headline-lg-mobile": ["26px", { lineHeight: "32px", fontWeight: "700" }]
          }
        }
      }
    }
  </script>

  <style>
    .squircle { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }

    a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid #e7b5f6; outline-offset: 2px;
    }

    /* Apenas estética do topo */
    .hero-adocao {
      position: relative;
      width: 100%;
      text-align: center;
      padding: 24px 0 8px;
    }

    .hero-adocao h1 {
      max-width: 900px;
      margin: 0 auto;
      font-size: clamp(38px, 5vw, 58px);
      line-height: 1.08;
      letter-spacing: -1.5px;
    }

    .hero-adocao > p {
      max-width: 720px;
      margin: 16px auto 0;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.55;
    }

    .hero-adocao-search {
      width: min(620px, 100%);
      margin: 28px auto 0;
    }

    .hero-adocao-visual {
      position: relative;
      width: min(560px, 92%);
      height: 250px;
      margin: 34px auto 0;
    }

    .hero-adocao-visual::before {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      left: 4%;
      top: 20px;
      border-radius: 50%;
      background: #f9d8ff;
      transform: rotate(-12deg);
    }

    .hero-adocao-visual::after {
      content: "";
      position: absolute;
      width: 145px;
      height: 145px;
      right: 4%;
      bottom: 4px;
      border-radius: 42% 58% 60% 40%;
      background: #ffd6fc;
      transform: rotate(18deg);
    }

    .hero-adocao-photo {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 0;
      width: 270px;
      height: 230px;
      transform: translateX(-50%) rotate(2deg);
      object-fit: cover;
      border: 9px solid #ffffff;
      border-radius: 42% 58% 48% 52% / 48% 42% 58% 52%;
      box-shadow: 0 18px 45px rgba(71, 32, 86, 0.16);
    }

    @media (max-width: 640px) {
      .hero-adocao {
        padding-top: 8px;
      }

      .hero-adocao-visual {
        height: 210px;
      }

      .hero-adocao-photo {
        width: 225px;
        height: 195px;
      }
    }
  </style>

  <link rel="stylesheet" href="shared.css">
</head>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">

<!-- O header e o footer são inseridos pelo shared.js, igual à home -->

<main class="flex-grow w-full max-w-[1200px] mx-auto px-gutter py-lg md:py-xl  flex flex-col gap-lg">

  <!-- TOPO -->
  <section class="hero-adocao">
    <h1 class="font-headline-lg-mobile md:font-headline-lg text-primary">
      Encontre seu novo melhor amigo
    </h1>

    <p class="font-body-lg text-on-surface-variant">
      Conheça os animais que estão esperando por uma família.
    </p>

    <div class="hero-adocao-search relative">
      <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">search</span>
      <input id="busca" type="search" placeholder="Buscar por nome ou raça"
             class="w-full pl-[48px] pr-sm py-sm rounded-xl border border-surface-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary">
    </div>

    <div class="hero-adocao-visual" aria-hidden="true">
      <img
        class="hero-adocao-photo"
        src="assets/animais/luna.jpg"
        alt=""
        onerror="this.src='assets/logo-footer.png'">
</div>
  </section>

  <!-- FILTROS -->
  <section class="bg-surface-container-low rounded-2xl p-md flex flex-wrap items-center justify-center gap-sm md:gap-md">
<div class="flex items-center gap-xs bg-surface-container-lowest rounded-full p-1 border border-surface-variant" id="filtroEspecie">
      <button type="button" data-especie="todos" class="px-sm py-1 rounded-full font-label-md text-label-md">Todos</button>
      <button type="button" data-especie="cao" class="px-sm py-1 rounded-full font-label-md text-label-md">Cães</button>
      <button type="button" data-especie="gato" class="px-sm py-1 rounded-full font-label-md text-label-md">Gatos</button>
    </div>

    <select id="filtroSexo" class="bg-surface-container-lowest border border-surface-variant rounded-full px-md py-xs font-label-md text-label-md">
      <option value="">Sexo</option>
      <option value="femea">Fêmea</option>
      <option value="macho">Macho</option>
    </select>

    <select id="filtroIdade" class="bg-surface-container-lowest border border-surface-variant rounded-full px-md py-xs font-label-md text-label-md">
      <option value="">Idade</option>
      <option value="filhote">Filhote (até 1 ano)</option>
      <option value="adulto">Adulto (1 a 7 anos)</option>
      <option value="idoso">Idoso (8 anos ou mais)</option>
    </select>

    <select id="filtroPorte" class="bg-surface-container-lowest border border-surface-variant rounded-full px-md py-xs font-label-md text-label-md">
      <option value="">Porte</option>
      <option value="pequeno">Pequeno</option>
      <option value="medio">Médio</option>
      <option value="grande">Grande</option>
    </select>

    <button type="button" id="limparFiltros" class="font-label-md text-label-md text-primary hover:underline">
      Limpar filtros
    </button>
  </section>

  <!-- RESULTADO -->
  <p id="contador" class="font-label-md text-label-md text-on-surface-variant -mb-sm" aria-live="polite"></p>

  <section id="animal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-md">
    <!-- Carregando -->
    <div class="rounded-2xl bg-surface-container-lowest p-md animate-pulse"><div class="aspect-[3/4] rounded-xl bg-surface-container-high"></div></div>
    <div class="rounded-2xl bg-surface-container-lowest p-md animate-pulse"><div class="aspect-[3/4] rounded-xl bg-surface-container-high"></div></div>
    <div class="rounded-2xl bg-surface-container-lowest p-md animate-pulse"><div class="aspect-[3/4] rounded-xl bg-surface-container-high"></div></div>
  </section>

  <p id="mensagem" class="hidden text-center text-on-surface-variant py-lg"></p>

</main>


<script src="shared.js"></script>

<script>
(() => {
  const grid = document.getElementById("animal-grid");
  const mensagem = document.getElementById("mensagem");
  const contador = document.getElementById("contador");
  const busca = document.getElementById("busca");
  const filtroSexo = document.getElementById("filtroSexo");
  const filtroIdade = document.getElementById("filtroIdade");
  const filtroPorte = document.getElementById("filtroPorte");
  const botoesEspecie = [...document.querySelectorAll("#filtroEspecie button")];

  let animais = [];
  let especieAtual = "todos";

  /* ---------- utilidades ---------- */

  // minúsculo e sem acento: "Cão" -> "cao", "Fêmea" -> "femea"
  const limpar = (v) => String(v ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

  const escapeHTML = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[c]));

  function getId(a) {
    if (a?._id && typeof a._id === "object") return a._id.$oid || a._id.toString();
    return a?._id || a?.id || "";
  }

  // "Cão", "Cachorro" -> cao | "Gato", "Gata" -> gato
  function especieDe(texto) {
    const t = limpar(texto);
    if (t.startsWith("ca")) return "cao";
    if (t.startsWith("gat")) return "gato";
    return "";
  }

  // "Fêmea" -> femea | "Macho" -> macho
  function sexoDe(texto) {
    const t = limpar(texto);
    if (t.startsWith("fem")) return "femea";
    if (t.startsWith("mac")) return "macho";
    return "";
  }

  // "Grande porte" -> grande
  function porteDe(texto) {
    const t = limpar(texto);
    if (t.includes("pequen")) return "pequeno";
    if (t.includes("medi")) return "medio";
    if (t.includes("grand")) return "grande";
    return "";
  }

  // "3 anos" -> adulto | "5 meses" -> filhote | "10 anos" -> idoso
  function faixaIdade(texto) {
    const t = limpar(texto);
    if (t.includes("filhote")) return "filhote";
    if (t.includes("idoso")) return "idoso";
    if (t.includes("adulto")) return "adulto";

    const numero = parseFloat((t.match(/\d+([.,]\d+)?/) || ["0"])[0].replace(",", "."));
    if (t.includes("mes")) return "filhote";
    if (!numero) return "";
    if (numero < 1) return "filhote";
    if (numero < 8) return "adulto";
    return "idoso";
  }

  /* ---------- card ---------- */

  function card(a) {
    const img = a.image || a.imagem || a.photo || a.foto || "assets/logo-footer.png";
    const nome = a.name || "Animal";
    const detalhes = [a.age, a.sex, a.size].filter(Boolean);

    return `
      <article class="group flex flex-col overflow-hidden rounded-2xl bg-surface-container-lowest shadow-[0_4px_20px_rgba(0,0,0,0.05)]">
        <div class="aspect-[3/4] w-full overflow-hidden bg-surface-container-high">
          <img class="h-full w-full object-cover object-[center_35%] transition-transform duration-500 group-hover:scale-105"
               src="${escapeHTML(img)}" alt="Foto de ${escapeHTML(nome)}"
               onerror="this.src='assets/logo-footer.png'">
        </div>
        <div class="flex flex-grow flex-col justify-between p-md">
          <div>
            <h2 class="font-headline-md text-[20px] text-on-surface">${escapeHTML(nome)}</h2>
            <p class="mb-sm text-sm text-on-surface-variant">${escapeHTML(a.breed || "Sem raça definida")}</p>
            <div class="flex flex-wrap gap-xs">
              ${detalhes.map((d) => `<span class="rounded-full bg-surface-variant px-sm py-xs text-[13px] font-semibold text-on-surface-variant">${escapeHTML(d)}</span>`).join("")}
            </div>
            ${a.description ? `<p class="mt-sm line-clamp-2 text-sm text-on-surface-variant">${escapeHTML(a.description)}</p>` : ""}
          </div>
          <a class="mt-md inline-flex w-full items-center justify-center rounded-full bg-primary py-sm font-label-md text-label-md text-on-primary transition-colors hover:bg-primary-container"
             href="detalhes-animal.html?id=${encodeURIComponent(getId(a))}">
            Conheça ${escapeHTML(nome)}
          </a>
        </div>
      </article>`;
  }

  /* ---------- filtros ---------- */

  function pintarBotoesEspecie() {
    botoesEspecie.forEach((b) => {
      const ativo = b.dataset.especie === especieAtual;
      b.className = "px-sm py-1 rounded-full font-label-md text-label-md transition-colors " +
        (ativo ? "bg-primary text-on-primary" : "text-on-surface-variant hover:bg-surface-container-high");
      b.setAttribute("aria-pressed", ativo);
    });
  }

  function aplicarFiltros() {
    const termo = limpar(busca.value);

    const visiveis = animais.filter((a) =>
      (!termo || limpar(`${a.name} ${a.breed}`).includes(termo)) &&
      (especieAtual === "todos" || especieDe(a.species) === especieAtual) &&
      (!filtroSexo.value || sexoDe(a.sex) === filtroSexo.value) &&
      (!filtroIdade.value || faixaIdade(a.age) === filtroIdade.value) &&
      (!filtroPorte.value || porteDe(a.size) === filtroPorte.value)
    );

    grid.innerHTML = visiveis.map(card).join("");
    grid.classList.toggle("hidden", visiveis.length === 0);

    contador.textContent = visiveis.length === 1 ? "1 animal encontrado" : `${visiveis.length} animais encontrados`;

    if (!visiveis.length) {
      mensagem.textContent = "Nenhum animal encontrado com esses filtros.";
      mensagem.classList.remove("hidden");
    } else {
      mensagem.classList.add("hidden");
    }
  }

  botoesEspecie.forEach((b) => b.addEventListener("click", () => {
    especieAtual = b.dataset.especie;
    pintarBotoesEspecie();
    aplicarFiltros();
  }));

  [filtroSexo, filtroIdade, filtroPorte].forEach((s) => s.addEventListener("change", aplicarFiltros));
  busca.addEventListener("input", aplicarFiltros);

  document.getElementById("limparFiltros").addEventListener("click", () => {
    busca.value = "";
    filtroSexo.value = filtroIdade.value = filtroPorte.value = "";
    especieAtual = "todos";
    pintarBotoesEspecie();
    aplicarFiltros();
  });

  /* ---------- carregar do banco ---------- */

  async function carregar() {
    try {
      const resposta = await fetch("/api/animals", { credentials: "include" });
      if (!resposta.ok) throw new Error("Erro " + resposta.status);

      const data = await resposta.json();
      const lista = Array.isArray(data) ? data : (data.animals || data.data || []);

      // só disponíveis, mais recentes primeiro
      animais = lista
        .filter((a) => {
          const s = limpar(a.status);
          return !s || s === "disponivel";
        })
        .sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));

      aplicarFiltros();
    } catch (erro) {
      console.error("Erro ao carregar animais:", erro);
      grid.classList.add("hidden");
      contador.textContent = "";
      mensagem.textContent = "Não foi possível carregar os animais agora. Verifique se o servidor está rodando.";
      mensagem.classList.remove("hidden");
    }
  }

  pintarBotoesEspecie();
  carregar();
})();
</script>

</body>
</html>
