<style>
.option-card.selected{border-color:#472056;background-color:#f6eef6;box-shadow:0 4px 14px rgba(95,55,110,.15)}
.option-card.selected .check-icon{opacity:1;transform:scale(1)}
.check-icon{opacity:0;transform:scale(.5);transition:all .2s cubic-bezier(.4,0,.2,1)}

</head><body class="bg-surface min-h-screen flex flex-col font-body-md text-on-surface">
<header class="flex items-center justify-between px-gutter py-md bg-surface w-full z-10 top-0">
<button aria-label="Voltar" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span></button>
<div class="font-label-md text-label-md text-outline">Passo 3 de 4</div>
<div class="w-10"></div>
</header>
<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop max-w-4xl mx-auto w-full pb-xl">
<div class="flex flex-col items-center text-center mt-md mb-lg">
<div class="w-24 h-24 rounded-full overflow-hidden mb-sm border-4 border-surface-container-highest shadow-sm relative"><img class="w-full h-full object-cover" alt="Luna" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_SXeebmt4pP7VjbmygyEsbcykNA3EMG1amAWX_ffWcYVjU3Xx87jC3SfA1FCN69ScJzLvE1P3RKd_KpbU6DhAB36jMGyg91LDXvX1zIwUhqBKBM-Op79b1f-x7-fmN79WsA6MniT56WAFmQVTtuOyLwcIgx47FwIK7e1kK35-0_fP67wXmLxUzwxkP5tqhVusbIOcEE4YC76DAJMxNniVNAiXELAU6Rc1OAH0R12MJNUsAEBKRWyt"></div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-xs">Como você gostaria de conhecer a Luna?</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-lg">Falta pouco! Escolha a melhor forma para você e a Luna terem o primeiro contato antes de finalizar a adoção.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md mb-lg">
<button class="option-card bg-surface-container-lowest border-2 border-surface-container-highest rounded-xl p-md flex flex-col text-left transition-all duration-200 hover:shadow-md hover:border-outline-variant relative group" data-choice="video" data-target="agendar-videochamada.html"><div class="absolute top-md right-md text-primary check-icon"><span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span></div><div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mb-sm"><span class="material-symbols-outlined">videocam</span></div><h3 class="font-headline-md text-headline-md text-primary mb-xs">Videochamada</h3><p class="font-body-md text-body-md text-on-surface-variant">Uma conversa online tranquila. Conheça a Luna em tempo real e tire dúvidas com o lar temporário sem sair de casa.</p></button>
<button class="option-card bg-surface-container-lowest border-2 border-surface-container-highest rounded-xl p-md flex flex-col text-left transition-all duration-200 hover:shadow-md hover:border-outline-variant relative group" data-choice="presencial" data-target="sem-horarios-visita.html"><div class="absolute top-md right-md text-primary check-icon"><span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span></div><div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mb-sm"><span class="material-symbols-outlined">location_on</span></div><h3 class="font-headline-md text-headline-md text-primary mb-xs">Visita Presencial</h3><p class="font-body-md text-body-md text-on-surface-variant">Um encontro inesquecível. Vá até o abrigo ou lar temporário para interagir, brincar e sentir a conexão de pertinho.</p></button>
</div>
<div class="flex justify-center mt-auto mb-lg"><a class="flex items-center gap-2 px-md py-sm rounded-full bg-surface-container-low text-secondary hover:bg-surface-container transition-colors font-label-md text-label-md" href="gerenciamento-feirinhas.html"><span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">event</span>Ver próximas feirinhas de adoção</a></div>
</main>
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-container-highest p-margin-mobile md:px-margin-desktop md:py-md flex justify-end z-20"><button class="w-full md:w-auto px-xl py-sm bg-primary text-on-primary rounded-full font-label-md text-label-md opacity-50 cursor-not-allowed transition-all duration-200 hover:shadow-lg" disabled id="btn-continue">Continuar</button></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{const cards=document.querySelectorAll('.option-card'),btn=document.getElementById('btn-continue');cards.forEach(card=>card.addEventListener('click',()=>{cards.forEach(c=>c.classList.remove('selected'));card.classList.add('selected');btn.disabled=false;btn.classList.remove('opacity-50','cursor-not-allowed');btn.classList.add('hover:bg-primary-container','hover:scale-[1.02]')}));btn.addEventListener('click',()=>{const selected=document.querySelector('.option-card.selected');if(selected&&selected.dataset.target)location.href=selected.dataset.target;});});
</script>
</body></html>
